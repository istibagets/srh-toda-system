name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ionic_frontend/package-lock.json

      - name: Build Ionic Frontend (Production)
        run: |
          cd ionic_frontend
          npm ci --prefer-offline || npm install --legacy-peer-deps
          npm run build || {
            echo "::warning::Frontend build failed, checking for pre-built www folder..."
            if [ -d "www" ] && [ "$(ls -A www)" ]; then
              echo "Using pre-built www folder from repository."
            else
              echo "::error::No pre-built www folder found!"
              exit 1
            fi
          }
          cd ..

      - name: Package Deployment Bundle
        run: |
          mkdir -p deploy_bundle
          
          # 1. Copy Laravel Backend Core Files
          for dir in app bootstrap config database routes public; do
            if [ -d "laravel_backend/$dir" ]; then
              cp -r "laravel_backend/$dir" deploy_bundle/
            fi
          done

          # 2. Copy Root Backend Files
          for file in artisan composer.json composer.lock; do
            if [ -f "laravel_backend/$file" ]; then
              cp "laravel_backend/$file" deploy_bundle/
            fi
          done

          # 3. Clean Bootstrap Cache
          rm -rf deploy_bundle/bootstrap/cache/*

          # 4. Copy Compiled Ionic Frontend (www -> ionic_www)
          cp -r ionic_frontend/www deploy_bundle/ionic_www

          # 5. Create Tarball Bundle
          tar -czf deploy_ionic.tar.gz -C deploy_bundle .
          rm -rf deploy_bundle

      - name: Transfer & Deploy to Oracle Cloud
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '168.107.79.216' }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          TARGET_DIR: ${{ secrets.REMOTE_ROOT || '/home/ubuntu/srh-toda-system' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret SSH_KEY is not defined in GitHub repository secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -i ~/.ssh/id_rsa"

          echo "Uploading deploy bundle to $SSH_USER@$SSH_HOST:$TARGET_DIR..."
          scp $SSH_OPTS deploy_ionic.tar.gz "$SSH_USER@$SSH_HOST:$TARGET_DIR/deploy_ionic.tar.gz"

          echo "Applying deployment updates on Oracle Cloud VM..."
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" << EOF
            set -e
            cd "$TARGET_DIR"
            echo "Extracting bundle..."
            tar -xzf deploy_ionic.tar.gz
            rm -f deploy_ionic.tar.gz

            echo "Syncing frontend assets to volume..."
            cp -r ionic_www/* ionic_frontend/www/ 2>/dev/null || true

            echo "Syncing backend code into the app container..."
            for d in app config database routes; do
              if [ -d "\$d" ]; then
                docker cp "\$d/." "srh_toda_app:/var/www/html/\$d/"
              fi
            done
            docker exec srh_toda_app sh -c 'mkdir -p storage/framework/views storage/framework/cache storage/framework/sessions && chown -R www-data:www-data storage' 2>/dev/null || true

            echo "Updating Nginx configuration & Adminer assets..."
            docker cp nginx.conf srh_toda_app:/etc/nginx/http.d/default.conf 2>/dev/null || true
            docker cp laravel_backend/public/adminer.css srh_toda_app:/var/www/html/public/adminer.css 2>/dev/null || true
            docker exec srh_toda_app nginx -s reload 2>/dev/null || true

            echo "Running Laravel maintenance & migrations..."
            docker exec srh_toda_app php artisan migrate --force
            docker exec srh_toda_app php artisan config:clear 2>/dev/null || true
            docker exec srh_toda_app php artisan route:clear 2>/dev/null || true
            docker exec srh_toda_app php artisan view:clear 2>/dev/null || true

            echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
          EOF

services:
  db:
    image: mariadb:10.11
    container_name: srh_toda_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: srh_toda_password_2026
      MYSQL_DATABASE: srh_link_toda
      MYSQL_USER: srh_user
      MYSQL_PASSWORD: srh_toda_password_2026
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srh_toda_app
    restart: always
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - app_uploads:/var/www/html/storage/app/public
      - ./laravel_backend/.env.production:/var/www/html/.env
      - ./ionic_frontend/www:/var/www/html/ionic_www
    depends_on:
      - db

volumes:
  mariadb_data:
    external: true
    name: srh-toda-backend_db_data
  app_uploads:
    external: true
    name: srh-toda-backend_app_uploads

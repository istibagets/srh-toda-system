server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 64M;
    charset utf-8;

    # 1. Reverb WebSocket Proxy (ws/wss connection from frontend)
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 2. Reverb Apps Event Publishing (Pusher/Reverb HTTP protocol)
    location /apps {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Laravel Storage Uploads (profile photos, driver docs)
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }

    # 4. Map Assets
    location /map-assets {
        alias /var/www/html/public/map-assets;
        try_files $uri $uri/ =404;
    }

    # 5. Adminer Database GUI
    location = /adminer.php {
        root /var/www/html/public;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/adminer.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # 6. Laravel API, Webhooks & Broadcast endpoints
    location /api {
        try_files $uri @laravel_api;
    }

    location ~ ^/(broadcasting|sanctum|srh-map-style\.json|maintenance-status|attachments|branding-logo) {
        try_files $uri @laravel_api;
    }

    location @laravel_api {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    # 6. Ionic PWA Single Page App (Angular / Ionic HTML5 routing)
    location / {
        root /var/www/html/ionic_www;
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { 
        root /var/www/html/ionic_www/assets/icon;
        access_log off; 
        log_not_found off; 
    }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.ht {
        deny all;
    }
}
